{
  "app-id": "de.hasihasi.hasihasi",
  "runtime": "org.freedesktop.Platform",
  "runtime-version": "24.08",
  "sdk": "org.freedesktop.Sdk",
  "command": "hasihasi",
  "separate-locales": false,

  "modules": [
    {
      "name": "hasihasi",
      "buildsystem": "cmake",
      "sources": [
        {
          "type": "git",
          "url": "https://github.com/Tremorian/hasihasi.git",
          "tag": "v0.1.0"
        }
      ],
      "config-opts": [
        "-DCMAKE_BUILD_TYPE=RelWithDebInfo",
        "-DHASIHASI_BUILD_SERVER=OFF",
        "-DHASIHASI_BUILD_TOOLS=OFF"
      ]
    }
  ]
}
